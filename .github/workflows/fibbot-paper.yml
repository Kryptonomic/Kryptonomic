# fibbot paper trading on GitHub Actions: one bot cycle per hour. PAPER ONLY - no live trading.
#
# Setup (Settings > Secrets and variables > Actions):
#   - variable FIBBOT_ENABLED = true        (required; the job is skipped otherwise)
#   - secret   ANTHROPIC_API_KEY            (optional; without it the bot runs without the brain)
#   - variable FIBBOT_CONFIG = path/to.json (optional; a committed config file)
#
# State (.fibbot/ minus candles and logs) is kept on the orphan branch "fibbot-state" as ONE
# squashed commit that is force-pushed every run, so that branch never accumulates history.
# Candles are kept in the Actions cache instead (they are large and can be re-downloaded).
name: fibbot paper trading

on:
  schedule:
    - cron: "7 * * * *"   # hourly, a few minutes after the candle close
  workflow_dispatch:

concurrency:
  group: fibbot-paper
  cancel-in-progress: false

permissions:
  contents: write          # used only by the restore and save steps (GH_TOKEN below)

jobs:
  tick:
    if: vars.FIBBOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The bot step has its own, shorter timeout (below): a step that times out FAILS instead of
    # being cancelled, so the report, state and candle steps still run in the time left.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash        # explicit bash = "bash --noprofile --norc -eo pipefail"
    env:
      FIBBOT_HOME: ${{ github.workspace }}/.fibbot
      FIBBOT_CONFIG: ${{ vars.FIBBOT_CONFIG }}
      STATE_BRANCH: fibbot-state
    steps:
      - uses: actions/checkout@v4
        with:
          # No token in .git/config while the bot (and its pip-installed dependencies) runs;
          # the restore and save steps pass it to git through their own environment only.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt pins exact versions, so an hourly install never picks up a new release.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state from the fibbot-state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          mkdir -p "$FIBBOT_HOME"
          rc=0
          git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "No $STATE_BRANCH branch yet: starting with an empty state directory."
          elif [ "$rc" -ne 0 ]; then
            # Never start from empty state on a network error: the save step would overwrite it.
            echo "::error::Could not check origin for the $STATE_BRANCH branch (git exit $rc)."
            exit 1
          else
            git fetch --no-tags --depth=1 origin "$STATE_BRANCH"
            git archive --format=tar FETCH_HEAD | tar -x -C "$FIBBOT_HOME" --anchored --exclude=candles
            ls -la "$FIBBOT_HOME"
          fi

      # restore/save are the two halves of actions/cache@v4. The save is a separate step so the
      # candles are kept even when one bot step failed (plain actions/cache saves on success only).
      - name: Restore the candle cache
        id: candles
        uses: actions/cache/restore@v4
        with:
          path: .fibbot/candles
          key: fibbot-candles-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fibbot-candles-

      # "run --once" exits 1 when any step of the pass failed (each step is isolated and the
      # database stays consistent: every write is a committed SQLite transaction), so the steps
      # below still run after a failure, a timeout or a cancel: state that cost API tokens
      # (signal reviews, research cycles, the attempt marker that stops a crashed cycle from
      # being paid for again on the next run) is never thrown away. The job is still marked
      # failed so you notice. 150 minutes leaves the job's 180 enough time for the saves.
      - name: Run one bot cycle
        id: bot
        timeout-minutes: 150
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python -m fibbot run --once
          else
            unset ANTHROPIC_API_KEY
            echo "::notice::ANTHROPIC_API_KEY secret is not set: running without the Claude brain."
            python -m fibbot run --once --no-brain
          fi

      # The steps below run whenever the bot step ran at all (succeeded, failed, timed out or was
      # cancelled), and never when it was skipped (e.g. the state could not be restored).
      - name: Show the report in the run summary
        if: ${{ always() && (steps.bot.outcome == 'success' || steps.bot.outcome == 'failure' || steps.bot.outcome == 'cancelled') }}
        run: |
          if [ -f "$FIBBOT_HOME/REPORT.md" ]; then
            head -c 900000 "$FIBBOT_HOME/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save state to the fibbot-state branch (one squashed commit)
        if: ${{ always() && (steps.bot.outcome == 'success' || steps.bot.outcome == 'failure' || steps.bot.outcome == 'cancelled') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compact each SQLite database and fold its write-ahead log into it so the commit is
          # self-contained, then check the sizes: GitHub rejects files over 100 MB, and a
          # rejected push would lose this run's state (and every later run's) without a clear
          # message.
          python - <<'EOF'
          import glob, os, sqlite3, sys
          home = os.environ["FIBBOT_HOME"]
          WARN_MB, MAX_MB = 50, 95
          for db in sorted(glob.glob(os.path.join(home, "*.sqlite"))):
              con = sqlite3.connect(db)
              try:
                  con.execute("VACUUM")
              except sqlite3.Error as e:
                  print(f"::warning::VACUUM of {db} failed ({e}); saving it as it is")
              busy = con.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone()[0]
              con.close()
              if busy:
                  sys.exit(f"checkpoint of {db} was blocked")
          too_big = False
          for root, dirs, files in os.walk(home):
              dirs[:] = [d for d in dirs if not (root == home and d == "candles")]
              for name in files:
                  if name.endswith((".log", ".sqlite-wal", ".sqlite-shm")) or ".log." in name:
                      continue
                  path = os.path.join(root, name)
                  mb = os.path.getsize(path) / 1e6
                  if mb > MAX_MB:
                      too_big = True
                      print(f"::error::{path} is {mb:.0f} MB; GitHub rejects files over 100 MB, so"
                            f" the state was NOT saved. Prune old experiments/journal entries or move"
                            f" the bot to Docker.")
                  elif mb > WARN_MB:
                      print(f"::warning::{path} is {mb:.0f} MB; the state cannot be saved once a"
                            f" file passes 100 MB (GitHub's limit).")
          sys.exit(1 if too_big else 0)
          EOF

          # Stage .fibbot/ into a throw-away index (the checkout and its index stay untouched),
          # then write a parentless commit and force-push it as the whole branch.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_DIR="$GITHUB_WORKSPACE/.git" GIT_WORK_TREE="$FIBBOT_HOME"
          export GIT_INDEX_FILE="$RUNNER_TEMP/fibbot-state.index"
          rm -f "$GIT_INDEX_FILE"
          cd "$FIBBOT_HOME"
          git add --all --force -- . ':(exclude)candles' ':(exclude)*.log' ':(exclude)*.log.*' \
            ':(exclude)*.sqlite-wal' ':(exclude)*.sqlite-shm'
          if [ -z "$(git ls-files)" ]; then
            echo "::warning::State directory is empty; not overwriting the $STATE_BRANCH branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" \
            -m "fibbot state $(date -u +%Y-%m-%dT%H:%M:%SZ) (run $GITHUB_RUN_ID)")
          git push --force origin "$commit:refs/heads/$STATE_BRANCH"

      - name: Save the candle cache
        if: ${{ always() && (steps.bot.outcome == 'success' || steps.bot.outcome == 'failure' || steps.bot.outcome == 'cancelled') }}
        uses: actions/cache/save@v4
        with:
          path: .fibbot/candles
          key: ${{ steps.candles.outputs.cache-primary-key }}
